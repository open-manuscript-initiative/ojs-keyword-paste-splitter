name: Package plugin release

on:
  push:
    tags:
      - '*.*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Four-part plugin version from version.xml
        required: true
        default: 1.1.1.0

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release="$(sed -n 's:.*<release>\(.*\)</release>.*:\1:p' version.xml)"
          test "$release" = "$RELEASE_VERSION"

      - name: Build PKP-compatible package
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/keywordPasteSplitter"
          mkdir -p "$package_root/js" "$package_root/locale"
          cp KeywordPasteSplitterPlugin.php index.php version.xml LICENSE README.md CHANGELOG.md "$package_root/"
          cp -R js/. "$package_root/js/"
          cp -R locale/. "$package_root/locale/"
          tar -C "$RUNNER_TEMP" -czf "keywordPasteSplitter-${RELEASE_VERSION}.tar.gz" keywordPasteSplitter
          md5sum "keywordPasteSplitter-${RELEASE_VERSION}.tar.gz" > "keywordPasteSplitter-${RELEASE_VERSION}.md5"
          sha256sum "keywordPasteSplitter-${RELEASE_VERSION}.tar.gz" > "keywordPasteSplitter-${RELEASE_VERSION}.sha256"
          test "$(tar -tzf "keywordPasteSplitter-${RELEASE_VERSION}.tar.gz" | cut -d/ -f1 | sort -u)" = keywordPasteSplitter

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists; refusing to modify it." >&2
            exit 1
          fi
          release_args=(
            "$RELEASE_VERSION"
            "keywordPasteSplitter-${RELEASE_VERSION}.tar.gz"
            "keywordPasteSplitter-${RELEASE_VERSION}.md5"
            "keywordPasteSplitter-${RELEASE_VERSION}.sha256"
            --title "Keyword Paste Splitter $RELEASE_VERSION"
            --generate-notes
          )
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_args+=(--target "$GITHUB_SHA")
          else
            release_args+=(--verify-tag)
          fi
          gh release create "${release_args[@]}"
