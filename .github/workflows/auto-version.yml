name: Prepare next plugin version

on:
  workflow_dispatch:
    inputs:
      part:
        description: Version component to increment
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Calculate version and update metadata
        id: version
        env:
          PART: ${{ inputs.part }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(sed -n 's:.*<release>\(.*\)</release>.*:\1:p' version.xml)"
          [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          IFS=. read -r major minor patch build <<< "$current"
          case "$PART" in
            major) major=$((major+1)); minor=0; patch=0; build=0 ;;
            minor) minor=$((minor+1)); patch=0; build=0 ;;
            patch) patch=$((patch+1)); build=0 ;;
          esac
          next="$major.$minor.$patch.$build"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          python3 - "$current" "$next" <<'PY'
          import pathlib, sys
          old, new = sys.argv[1:]
          p = pathlib.Path("version.xml")
          s = p.read_text()
          s = s.replace("<release>"+old+"</release>", "<release>"+new+"</release>")
          import datetime
          s = __import__("re").sub(r"<date>[^<]+</date>", "<date>"+datetime.date.today().isoformat()+"</date>", s)
          p.write_text(s)
          p = pathlib.Path(".github/workflows/release.yml")
          s = p.read_text().replace("default: "+old, "default: "+new)
          p.write_text(s)
          p = pathlib.Path("CHANGELOG.md")
          s = p.read_text().replace("# Changelog\n", "# Changelog\n\n## ["+new+"] - "+datetime.date.today().isoformat()+"\n\n### Changed\n\n- Automated version bump; describe changes before release.\n", 1)
          p.write_text(s)
          p = pathlib.Path("README.md")
          s = p.read_text()
          marker = "| Plugin release | OJS release |\n| --- | --- |\n"
          if marker not in s: raise SystemExit("README compatibility table not found")
          s = s.replace(marker, marker+"| "+new+" | OJS 3.5.0-5 LTS |\n", 1)
          p.write_text(s)
          PY
      - name: Open version bump pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail
          branch="release/auto-$NEXT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add version.xml CHANGELOG.md README.md .github/workflows/release.yml
          git commit -m "release: prepare $NEXT"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Release $NEXT" --body "Automated version bump. Review changelog and CI before merging. After merge, run Package plugin release with version $NEXT."
